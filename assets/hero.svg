<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">Rainchen futuristic profile header</title>
  <desc id="desc">An animated blue and pink system interface introducing Rainchen, a macOS software maker.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07111f"/>
      <stop offset="0.58" stop-color="#101c38"/>
      <stop offset="1" stop-color="#251b39"/>
    </linearGradient>
    <linearGradient id="horizon" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6f91dd" stop-opacity="0"/>
      <stop offset="0.45" stop-color="#88a9f4"/>
      <stop offset="0.75" stop-color="#e5a8d4"/>
      <stop offset="1" stop-color="#f2b5d8" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="scan" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#93b4ff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#93b4ff" stop-opacity="0.24"/>
      <stop offset="1" stop-color="#93b4ff" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="orb" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#d9e4ff" stop-opacity="0.36"/>
      <stop offset="0.65" stop-color="#8aa8ef" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#8aa8ef" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#86a8eb" stroke-opacity="0.085" stroke-width="1"/>
    </pattern>
    <pattern id="micro" width="6" height="6" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="0.65" fill="#b7c9f6" fill-opacity="0.16"/>
    </pattern>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="frame"><rect x="8" y="8" width="1184" height="344" rx="20"/></clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1200" height="360" fill="url(#bg)"/>
    <rect width="1200" height="360" fill="url(#grid)"/>
    <rect x="715" y="0" width="485" height="360" fill="url(#micro)" opacity="0.7"/>
    <circle cx="1030" cy="156" r="255" fill="url(#orb)"/>
    <path d="M0 286 C180 250 272 306 430 269 C595 230 688 276 840 224 C978 176 1084 212 1200 170 L1200 360 L0 360Z" fill="#0a1426" opacity="0.84"/>
    <path d="M0 286 C180 250 272 306 430 269 C595 230 688 276 840 224 C978 176 1084 212 1200 170" fill="none" stroke="url(#horizon)" stroke-width="2"/>
    <path d="M0 306 C205 278 324 325 501 288 C673 252 790 285 955 235 C1051 206 1126 211 1200 199" fill="none" stroke="#708dcc" stroke-opacity="0.23" stroke-width="1"/>

    <rect x="0" y="-90" width="1200" height="90" fill="url(#scan)">
      <animate attributeName="y" values="-90;360" dur="6s" repeatCount="indefinite"/>
    </rect>

    <g transform="translate(72 62)">
      <text x="0" y="0" fill="#87a4e6" font-family="SFMono-Regular,Consolas,Liberation Mono,monospace" font-size="12" letter-spacing="3">IDENTITY / ONLINE</text>
      <circle cx="178" cy="-4" r="4" fill="#eeacd6" filter="url(#glow)">
        <animate attributeName="opacity" values="1;.3;1" dur="1.8s" repeatCount="indefinite"/>
      </circle>
      <text x="0" y="74" fill="#eff4ff" font-family="Inter,Avenir Next,Helvetica,Arial,sans-serif" font-size="72" font-weight="700" letter-spacing="7">RAINCHEN</text>
      <text x="4" y="112" fill="#aebfe8" font-family="SFMono-Regular,Consolas,Liberation Mono,monospace" font-size="15" letter-spacing="2">MACOS NATIVE SYSTEMS / SOFTWARE MAKER</text>
      <line x1="4" y1="137" x2="430" y2="137" stroke="#86a9ef" stroke-opacity="0.35"/>
      <text x="4" y="172" fill="#d8e4ff" font-family="SFMono-Regular,Consolas,Liberation Mono,monospace" font-size="15">&gt; building quiet tools with sharp edges</text>
      <rect x="448" y="158" width="8" height="18" fill="#efadd8">
        <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;.45;.5;1" dur="1.1s" repeatCount="indefinite"/>
      </rect>
    </g>

    <g transform="translate(915 78)" fill="none">
      <circle cx="92" cy="92" r="74" stroke="#91ade9" stroke-opacity="0.34"/>
      <circle cx="92" cy="92" r="52" stroke="#91ade9" stroke-opacity="0.18" stroke-dasharray="3 8">
        <animateTransform attributeName="transform" type="rotate" from="0 92 92" to="360 92 92" dur="20s" repeatCount="indefinite"/>
      </circle>
      <circle cx="92" cy="92" r="27" stroke="#efadd8" stroke-opacity="0.6" stroke-dasharray="24 8">
        <animateTransform attributeName="transform" type="rotate" from="360 92 92" to="0 92 92" dur="8s" repeatCount="indefinite"/>
      </circle>
      <path d="M92 5V30 M92 154V179 M5 92H30 M154 92H179" stroke="#91ade9" stroke-opacity="0.5"/>
      <circle cx="92" cy="92" r="6" fill="#e7efff" stroke="none" filter="url(#glow)">
        <animate attributeName="r" values="5;8;5" dur="2.4s" repeatCount="indefinite"/>
      </circle>
      <circle cx="144" cy="40" r="3.5" fill="#efadd8" stroke="none" filter="url(#glow)">
        <animate attributeName="opacity" values=".25;1;.25" dur="2.1s" repeatCount="indefinite"/>
      </circle>
    </g>

    <g font-family="SFMono-Regular,Consolas,Liberation Mono,monospace" font-size="10" letter-spacing="1.5" fill="#91a6d5">
      <text x="76" y="329">SYS.SWIFT</text>
      <text x="182" y="329">UI.APPKIT</text>
      <text x="295" y="329">ENV.MACOS</text>
      <text x="1112" y="329" text-anchor="end">CN / ZH</text>
    </g>
  </g>

  <rect x="8.5" y="8.5" width="1183" height="343" rx="19.5" fill="none" stroke="#89a8eb" stroke-opacity="0.32"/>
  <path d="M8 45V28Q8 8 28 8H48 M1152 8H1172Q1192 8 1192 28V48 M1192 312V332Q1192 352 1172 352H1152 M48 352H28Q8 352 8 332V312" fill="none" stroke="#e7a8d2" stroke-opacity="0.68" stroke-width="2"/>
</svg>
