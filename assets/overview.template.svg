<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
  <title id="title">Rainchen profile overview</title>
  <desc id="desc">A unified profile overview with selected macOS projects and GitHub metrics.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a1323"/>
      <stop offset="0.6" stop-color="#0d172a"/>
      <stop offset="1" stop-color="#161a30"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#86a5e8"/>
      <stop offset="0.7" stop-color="#9aaee0" stop-opacity="0.42"/>
      <stop offset="1" stop-color="#e9a8d2"/>
    </linearGradient>
    <linearGradient id="shelf" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8eaae6" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#a7b9e4" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#e9a8d2" stop-opacity="0"/>
    </linearGradient>
    <filter id="iconShadow" x="-30%" y="-30%" width="160%" height="180%">
      <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#030814" flood-opacity="0.45"/>
    </filter>
  </defs>

  <rect x="1" y="1" width="1198" height="558" rx="22" fill="url(#background)" stroke="url(#edge)" stroke-opacity="0.58"/>
  <path d="M1 58V23Q1 1 23 1H76 M1124 559H1177Q1199 559 1199 537V502" fill="none" stroke="url(#edge)" stroke-width="2"/>

  <g font-family="SFMono-Regular,Consolas,Liberation Mono,monospace">
    <text x="72" y="108" fill="#eef3ff" font-family="Avenir Next,Helvetica Neue,Arial,sans-serif" font-size="46" font-weight="700" letter-spacing="3">SELECTED WORK</text>
    <text x="74" y="161" fill="#dba9cf" font-size="14" letter-spacing="2">macOS software maker</text>
    <text x="74" y="232" fill="#e3eafa" font-family="PingFang SC,Hiragino Sans GB,Microsoft YaHei,system-ui,sans-serif" font-size="20">把复杂的事情，做成不打扰人的工具。</text>
    <text x="74" y="271" fill="#8fa3cd" font-family="PingFang SC,Hiragino Sans GB,Microsoft YaHei,system-ui,sans-serif" font-size="14">原生 macOS 应用 / 系统交互 / 效率工具</text>
    <text x="74" y="332" fill="#7489b5" font-size="11" letter-spacing="1.5">SWIFT / APPKIT / TYPESCRIPT</text>

    <line x1="540" y1="72" x2="540" y2="360" stroke="#91a9d8" stroke-opacity="0.2"/>

    <text x="604" y="84" fill="#94a9d3" font-size="11" letter-spacing="2.5">Y-SERIES</text>
    <text x="1128" y="84" text-anchor="end" fill="#6f83ad" font-size="10" letter-spacing="1.4">NATIVE MACOS</text>

    <g filter="url(#iconShadow)">
      <image href="data:image/png;base64,__Y_CLIP_DATA__" x="594" y="135" width="128" height="128"/>
      <image href="data:image/png;base64,__Y_DOCK_DATA__" x="784" y="108" width="158" height="158"/>
      <image href="data:image/png;base64,__Y_KEYS_DATA__" x="1004" y="135" width="128" height="128"/>
    </g>
    <path d="M574 282C700 301 1015 301 1152 282" fill="none" stroke="url(#shelf)" stroke-width="2"/>
    <text x="658" y="325" text-anchor="middle" fill="#dfe7f8" font-size="14" letter-spacing="1.2">Y-CLIP</text>
    <text x="863" y="325" text-anchor="middle" fill="#f0dce9" font-size="14" letter-spacing="1.2">Y-DOCK</text>
    <text x="1068" y="325" text-anchor="middle" fill="#dfe7f8" font-size="14" letter-spacing="1.2">Y-KEYS</text>

    <line x1="72" y1="390" x2="1128" y2="390" stroke="#91a9d8" stroke-opacity="0.2"/>

    <g transform="translate(72 420)">
      <text x="0" y="12" fill="#778bb7" font-size="9" letter-spacing="1.4">PUBLIC REPOS</text>
      <text x="0" y="65" fill="#eef3ff" font-size="36" font-weight="700">14</text>
      <text x="116" y="12" fill="#778bb7" font-size="9" letter-spacing="1.4">STARS</text>
      <text x="116" y="65" fill="#eef3ff" font-size="36" font-weight="700">4</text>
      <text x="218" y="12" fill="#778bb7" font-size="9" letter-spacing="1.4">FOLLOWERS</text>
      <text x="218" y="65" fill="#eef3ff" font-size="36" font-weight="700">0</text>
      <text x="350" y="12" fill="#778bb7" font-size="9" letter-spacing="1.4">SINCE</text>
      <text x="350" y="65" fill="#eef3ff" font-size="28" font-weight="700">2020</text>
    </g>

    <g transform="translate(604 420)">
      <text x="0" y="12" fill="#778bb7" font-size="9" letter-spacing="1.4">REPOSITORY LANGUAGES</text>
      <text x="0" y="51" fill="#ed9b84" font-size="12">HTML 27%</text>
      <text x="115" y="51" fill="#f3b0a0" font-size="12">SWIFT 27%</text>
      <text x="238" y="51" fill="#75a8e8" font-size="12">TYPESCRIPT 9%</text>
      <text x="0" y="82" fill="#e6d36e" font-size="12">JAVASCRIPT 9%</text>
      <text x="150" y="82" fill="#b3c0d3" font-size="12">C 9%</text>
      <text x="238" y="82" fill="#c396d5" font-size="12">DART + SHELL 18%</text>
    </g>

    <text x="1128" y="526" text-anchor="end" fill="#7186b1" font-size="9" letter-spacing="1.4">CLICK TO EXPLORE ALL BUILDS</text>
  </g>
</svg>
