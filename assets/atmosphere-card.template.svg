<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">雨晨的个人介绍</title>
  <desc id="desc">雪山蓝调背景上的个人介绍：独立开发者，关注跨平台产品、AI 与基础设施。</desc>

  <defs>
    <clipPath id="frame"><rect x="6" y="6" width="1188" height="663" rx="22"/></clipPath>
    <linearGradient id="sceneShade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#07111f" stop-opacity="0.56"/>
      <stop offset="0.62" stop-color="#101a32" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#2e2442" stop-opacity="0.06"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07111f" stop-opacity="0.90"/>
      <stop offset="1" stop-color="#111c35" stop-opacity="0.74"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#94b4ff"/>
      <stop offset="0.7" stop-color="#d5b1e4"/>
      <stop offset="1" stop-color="#f1a8d2"/>
    </linearGradient>
    <linearGradient id="scan" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9bb8ff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#9bb8ff" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#9bb8ff" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#c5d4ff" stroke-opacity="0.07"/>
    </pattern>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <g clip-path="url(#frame)">
    <image href="data:image/jpeg;base64,__BACKGROUND_DATA__" width="1200" height="675" preserveAspectRatio="xMidYMid slice"/>
    <rect width="1200" height="675" fill="url(#sceneShade)"/>
    <rect width="1200" height="675" fill="url(#grid)"/>

    <rect x="0" y="-100" width="1200" height="100" fill="url(#scan)">
      <animate attributeName="y" values="-100;675" dur="7s" repeatCount="indefinite"/>
    </rect>

    <g transform="translate(42 40)">
      <rect width="838" height="355" rx="22" fill="url(#panel)" stroke="#9eb9f4" stroke-opacity="0.36"/>
      <path d="M0 54V22Q0 0 22 0H62 M776 355H816Q838 355 838 333V293" fill="none" stroke="url(#edge)" stroke-width="2"/>

      <g font-family="SFMono-Regular,Consolas,Liberation Mono,monospace">
        <text x="32" y="42" fill="#a9bee9" font-size="11" letter-spacing="3">PROFILE / RAINCHEN_537</text>
        <circle cx="268" cy="38" r="4" fill="#eeacd6" filter="url(#glow)">
          <animate attributeName="opacity" values="1;.3;1" dur="1.8s" repeatCount="indefinite"/>
        </circle>
        <text x="802" y="42" text-anchor="end" fill="#8ea5d6" font-size="10" letter-spacing="2">PROFILE</text>
      </g>

      <text x="32" y="108" fill="#f4f7ff" font-family="PingFang SC,Hiragino Sans GB,Microsoft YaHei,system-ui,sans-serif" font-size="50" font-weight="700" letter-spacing="1">你好，我是雨晨。</text>
      <text x="34" y="153" fill="#d6e1f7" font-family="PingFang SC,Hiragino Sans GB,Microsoft YaHei,system-ui,sans-serif" font-size="18" letter-spacing="1">独立开发者 · 跨平台产品 · AI 与基础设施</text>
      <line x1="34" y1="178" x2="802" y2="178" stroke="#a9bdec" stroke-opacity="0.24"/>

      <g font-family="SFMono-Regular,Consolas,Liberation Mono,monospace" font-size="11" letter-spacing="0.8">
        <g transform="translate(34 196)"><rect width="82" height="30" rx="8" fill="#15223e" stroke="#9eb7eb" stroke-opacity="0.28"/><circle cx="14" cy="15" r="3" fill="#f39c85"/><text x="24" y="19" fill="#e8efff">DART</text></g>
        <g transform="translate(126 196)"><rect width="90" height="30" rx="8" fill="#15223e" stroke="#9eb7eb" stroke-opacity="0.28"/><circle cx="14" cy="15" r="3" fill="#e8efff"/><text x="24" y="19" fill="#e8efff">FLUTTER</text></g>
        <g transform="translate(226 196)"><rect width="86" height="30" rx="8" fill="#15223e" stroke="#9eb7eb" stroke-opacity="0.28"/><circle cx="14" cy="15" r="3" fill="#83b9ff"/><text x="24" y="19" fill="#e8efff">PYTHON</text></g>
        <g transform="translate(322 196)"><rect width="118" height="30" rx="8" fill="#15223e" stroke="#9eb7eb" stroke-opacity="0.28"/><circle cx="14" cy="15" r="3" fill="#8ab4f8"/><text x="24" y="19" fill="#e8efff">TYPESCRIPT</text></g>
        <g transform="translate(450 196)"><rect width="118" height="30" rx="8" fill="#15223e" stroke="#9eb7eb" stroke-opacity="0.28"/><circle cx="14" cy="15" r="3" fill="#f3d77d"/><text x="24" y="19" fill="#e8efff">SWIFT</text></g>
        <g transform="translate(578 196)"><rect width="54" height="30" rx="8" fill="#15223e" stroke="#9eb7eb" stroke-opacity="0.28"/><circle cx="14" cy="15" r="3" fill="#aabef4"/><text x="24" y="19" fill="#e8efff">C</text></g>
        <g transform="translate(642 196)"><rect width="78" height="30" rx="8" fill="#15223e" stroke="#9eb7eb" stroke-opacity="0.28"/><circle cx="14" cy="15" r="3" fill="#b7e3d0"/><text x="24" y="19" fill="#e8efff">LINUX</text></g>
        <g transform="translate(730 196)"><rect width="70" height="30" rx="8" fill="#15223e" stroke="#9eb7eb" stroke-opacity="0.28"/><circle cx="14" cy="15" r="3" fill="#f39b85"/><text x="24" y="19" fill="#e8efff">GIT</text></g>
      </g>

      <g font-family="SFMono-Regular,Consolas,Liberation Mono,monospace" font-size="11" letter-spacing="1.2">
        <g transform="translate(34 254)"><rect width="146" height="42" rx="10" fill="#0c172b" stroke="#90acf0" stroke-opacity="0.42"/><text x="16" y="17" fill="#7f96c8" font-size="8">BUILD</text><text x="16" y="33" fill="#edf3ff" font-size="12">PRODUCTS</text></g>
        <g transform="translate(192 254)"><rect width="220" height="42" rx="10" fill="#0c172b" stroke="#e8a8d3" stroke-opacity="0.46"/><text x="16" y="17" fill="#9b85ad" font-size="8">FOCUS</text><text x="16" y="33" fill="#f5dfef" font-size="12">APPS / AI / INFRA</text></g>
        <g transform="translate(424 254)"><rect width="188" height="42" rx="10" fill="#0c172b" stroke="#90acf0" stroke-opacity="0.42"/><circle cx="166" cy="21" r="4" fill="#eeacd6" filter="url(#glow)"><animate attributeName="opacity" values="1;.25;1" dur="2s" repeatCount="indefinite"/></circle><text x="16" y="17" fill="#7f96c8" font-size="8">STATUS</text><text x="16" y="33" fill="#edf3ff" font-size="12">BUILDING</text></g>
      </g>

      <g font-family="SFMono-Regular,Consolas,Liberation Mono,monospace" font-size="9" letter-spacing="1.4" fill="#7f96c8">
        <text x="34" y="329">CN / ZH · UTC+08:00</text>
        <text x="802" y="329" text-anchor="end">RAINCHEN537</text>
      </g>
    </g>

    <g transform="translate(938 64)" fill="none">
      <circle cx="96" cy="96" r="74" stroke="#d8e4ff" stroke-opacity="0.28"/>
      <circle cx="96" cy="96" r="49" stroke="#d8e4ff" stroke-opacity="0.22" stroke-dasharray="3 8"><animateTransform attributeName="transform" type="rotate" from="0 96 96" to="360 96 96" dur="18s" repeatCount="indefinite"/></circle>
      <circle cx="96" cy="96" r="24" stroke="#efa8d4" stroke-opacity="0.62" stroke-dasharray="20 8"><animateTransform attributeName="transform" type="rotate" from="360 96 96" to="0 96 96" dur="8s" repeatCount="indefinite"/></circle>
      <path d="M96 4V28 M96 164V188 M4 96H28 M164 96H188" stroke="#d8e4ff" stroke-opacity="0.42"/>
      <circle cx="96" cy="96" r="5" fill="#f6f8ff" stroke="none" filter="url(#glow)"><animate attributeName="r" values="4;7;4" dur="2.4s" repeatCount="indefinite"/></circle>
    </g>

    <g font-family="SFMono-Regular,Consolas,Liberation Mono,monospace" font-size="9" letter-spacing="1.5" fill="#e4ebff" fill-opacity="0.82">
      <text x="24" y="646">VISUAL / A LONG WALK · MMAIR</text>
      <text x="1174" y="646" text-anchor="end"></text>
    </g>
  </g>

  <rect x="6.5" y="6.5" width="1187" height="662" rx="21.5" fill="none" stroke="url(#edge)" stroke-opacity="0.62"/>
</svg>
