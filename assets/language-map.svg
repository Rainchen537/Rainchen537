<svg xmlns="http://www.w3.org/2000/svg" width="520" height="200" viewBox="0 0 520 200" role="img" aria-labelledby="title desc">
  <title id="title">Rainchen's repositories by language</title>
  <desc id="desc">Repository language distribution led by HTML and Swift.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1425"/>
      <stop offset="1" stop-color="#111c35"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8faef1"/>
      <stop offset="1" stop-color="#e8a8d3"/>
    </linearGradient>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#9db6ed" stroke-opacity="0.055"/></pattern>
    <clipPath id="bar"><rect x="24" y="60" width="472" height="14" rx="7"/></clipPath>
  </defs>
  <rect x="1" y="1" width="518" height="198" rx="16" fill="url(#bg)" stroke="url(#edge)" stroke-opacity="0.55"/>
  <rect x="1" y="1" width="518" height="198" rx="16" fill="url(#grid)"/>
  <path d="M1 45V17Q1 1 17 1H50 M470 199H503Q519 199 519 183V155" fill="none" stroke="url(#edge)" stroke-width="2"/>
  <g font-family="SFMono-Regular,Consolas,Liberation Mono,monospace">
    <text x="24" y="31" fill="#9db5e7" font-size="10" letter-spacing="2.4">REPOSITORY LANGUAGE MAP</text>
    <text x="496" y="31" text-anchor="end" fill="#7088ba" font-size="9" letter-spacing="1.2">11 DETECTED</text>
    <line x1="24" y1="47" x2="496" y2="47" stroke="#90a9df" stroke-opacity="0.2"/>
    <g clip-path="url(#bar)">
      <rect x="24" y="60" width="129" height="14" fill="#e34c26"/>
      <rect x="153" y="60" width="129" height="14" fill="#f39c85"/>
      <rect x="282" y="60" width="43" height="14" fill="#3178c6"/>
      <rect x="325" y="60" width="43" height="14" fill="#f1e05a"/>
      <rect x="368" y="60" width="43" height="14" fill="#a8b9cc"/>
      <rect x="411" y="60" width="85" height="14" fill="#b58acb"/>
    </g>
    <g font-size="10">
      <g transform="translate(24 96)"><circle cx="4" cy="4" r="4" fill="#e34c26"/><text x="16" y="8" fill="#dbe5fa">HTML</text><text x="145" y="8" fill="#8ea5d5">27%</text></g>
      <g transform="translate(24 126)"><circle cx="4" cy="4" r="4" fill="#f39c85"/><text x="16" y="8" fill="#dbe5fa">SWIFT</text><text x="145" y="8" fill="#8ea5d5">27%</text></g>
      <g transform="translate(24 156)"><circle cx="4" cy="4" r="4" fill="#3178c6"/><text x="16" y="8" fill="#dbe5fa">TYPESCRIPT</text><text x="145" y="8" fill="#8ea5d5">9%</text></g>
      <g transform="translate(270 96)"><circle cx="4" cy="4" r="4" fill="#f1e05a"/><text x="16" y="8" fill="#dbe5fa">JAVASCRIPT</text><text x="200" y="8" fill="#8ea5d5">9%</text></g>
      <g transform="translate(270 126)"><circle cx="4" cy="4" r="4" fill="#a8b9cc"/><text x="16" y="8" fill="#dbe5fa">C</text><text x="200" y="8" fill="#8ea5d5">9%</text></g>
      <g transform="translate(270 156)"><circle cx="4" cy="4" r="4" fill="#b58acb"/><text x="16" y="8" fill="#dbe5fa">DART + SHELL</text><text x="200" y="8" fill="#8ea5d5">18%</text></g>
    </g>
  </g>
</svg>
