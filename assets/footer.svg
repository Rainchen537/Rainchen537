<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="96" viewBox="0 0 1200 96" role="img" aria-labelledby="title desc">
  <title id="title">Live activity signal</title>
  <desc id="desc">A continuous animated signal moving along a heartbeat waveform.</desc>
  <defs>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7897df" stop-opacity="0"/>
      <stop offset="0.25" stop-color="#7897df"/>
      <stop offset="0.72" stop-color="#e8a5d2"/>
      <stop offset="1" stop-color="#e8a5d2" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-200%" width="140%" height="500%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>@media (prefers-reduced-motion: reduce) {.pulse {display:none}}</style>
  </defs>
  <path d="M0 48H224l16-1 13-2 11-7 10-21 12 59 12-74 12 92 13-61 12 24 15-9 14-2h130l15-1 12-4 11-12 11 37 12-64 13 92 12-69 13 41 14-13 16-3h298" fill="none" stroke="#7897df" stroke-opacity="0.2" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <path class="pulse" d="M0 48H224l16-1 13-2 11-7 10-21 12 59 12-74 12 92 13-61 12 24 15-9 14-2h130l15-1 12-4 11-12 11 37 12-64 13 92 12-69 13 41 14-13 16-3h298" fill="none" stroke="url(#line)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)" stroke-dasharray="180 1420" stroke-dashoffset="180">
    <animate attributeName="stroke-dashoffset" values="180;-1420" dur="3.6s" repeatCount="indefinite"/>
  </path>
  <circle class="pulse" r="4" fill="#f1b0da" filter="url(#glow)">
    <animateMotion path="M0 48H224l16-1 13-2 11-7 10-21 12 59 12-74 12 92 13-61 12 24 15-9 14-2h130l15-1 12-4 11-12 11 37 12-64 13 92 12-69 13 41 14-13 16-3h298" dur="3.6s" repeatCount="indefinite"/>
  </circle>
</svg>
